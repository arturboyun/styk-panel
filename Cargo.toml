[workspace]
resolver = "2"
members = ["crates/styk-proto", "crates/styk-agent", "crates/styk-panel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
styk-proto = { path = "crates/styk-proto" }

[profile.release]
lto = "thin"
strip = true
