[package]
name = "styk-panel"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
styk-proto.workspace = true

aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
base64 = "0.22"
bollard = "0.18"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hmac = "0.12"
rand = "0.8"
rpassword = "7"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
thiserror = "2"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "compression-gzip"] }
uuid = { version = "1", features = ["v4", "serde"] }
